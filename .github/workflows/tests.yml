name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  QT_QPA_PLATFORM: offscreen

# Nothing is excluded by file. The few tests that read measurements recorded on
# a developer machine (the untracked acceptance/ folder) skip themselves, one by
# one, with the reason, when that evidence is absent; everything else in those
# files runs here. `-rs` prints every skip reason in the log.

jobs:
  base:
    name: base suite (no optional providers)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q -rs

  production:
    # The profile the desktop executable is built from: NASA CEA and CoolProp
    # (packaging/RocketForge.spec).
    name: production profile suite (NASA CEA + CoolProp)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-thermochemistry.txt -r requirements-fluids.txt

      - name: Run pytest
        run: python -m pytest -q -rs

  minimum-versions:
    # Every '>=' floor in the requirement files, installed exactly, so a floor
    # is a version the suite has run on rather than a number in a file.
    name: base suite at the declared minimum versions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies at their floors
        run: |
          python -m pip install --upgrade pip
          python .github/scripts/minimum_constraints.py minimum-constraints.txt requirements.txt requirements-dev.txt
          pip install -r requirements.txt -r requirements-dev.txt -c minimum-constraints.txt
          pip list

      - name: Run pytest
        run: python -m pytest -q -rs
