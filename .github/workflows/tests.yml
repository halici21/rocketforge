name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  base:
    name: base suite (UI shell + compressible flow)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q

  thermochemistry:
    name: production suite (with NASA CEA)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-thermochemistry.txt

      - name: Run pytest
        run: python -m pytest -q
